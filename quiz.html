let currentQuestion = 0;
let score = 0;
let time = 20;
let timer;
let answered = false;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("nextBtn");
const timeEl = document.getElementById("time");
const scoreEl = document.getElementById("score");
const questionNoEl = document.getElementById("questionNo");
const progressBar = document.getElementById("progressBar");

function loadQuestion(){

  answered = false;
  clearInterval(timer);

  time = 20;
  timeEl.textContent = time;

  const q = questions[currentQuestion];

  questionNoEl.textContent =
    `Question ${currentQuestion+1} / ${questions.length}`;

  questionEl.textContent = q.q;

  optionsEl.innerHTML = "";

  q.o.forEach((option,index)=>{

    const button = document.createElement("button");

    button.className = "option";
    button.textContent =
      String.fromCharCode(65+index) + ". " + option;

    button.onclick = () => selectAnswer(index,button);

    optionsEl.appendChild(button);

  });

  nextBtn.style.display = "none";

  const progress =
    ((currentQuestion) / questions.length) * 100;

  progressBar.style.width = progress + "%";

  startTimer();
}

function startTimer(){

  timer = setInterval(()=>{

    time--;
    timeEl.textContent = time;

    if(time <= 0){

      clearInterval(timer);

      if(!answered){
        answered = true;

        const buttons =
          document.querySelectorAll(".option");

        buttons.forEach(b=>b.classList.add("disabled"));

        buttons[questions[currentQuestion].a]
          .classList.add("correct");

        nextBtn.style.display = "block";
      }

    }

  },1000);
}

function selectAnswer(index,button){

  if(answered) return;

  answered = true;

  clearInterval(timer);

  const correct =
    questions[currentQuestion].a;

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(b=>b.classList.add("disabled"));

  if(index === correct){

    button.classList.add("correct");
    score++;

  }else{

    button.classList.add("wrong");
    buttons[correct].classList.add("correct");

  }

  scoreEl.textContent =
    "Score: " + score;

  nextBtn.style.display = "block";
}

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion >= questions.length){

    showResult();

  }else{

    loadQuestion();

  }
}

function showResult(){

  clearInterval(timer);

  document.getElementById("quizBox")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "block";

  document.getElementById("finalScore")
    .textContent =
    score + " / " + questions.length;

  let percentage =
    (score / questions.length) * 100;

  let message;

  if(percentage >= 90){

    message = "🔥 Outstanding! Chemistry Champion!";

  }else if(percentage >= 75){

    message = "👏 Excellent! Very strong preparation.";

  }else if(percentage >= 50){

    message = "👍 Good! Keep revising and practicing.";

  }else{

    message = "📚 Keep practicing. You can improve!";

  }

  document.getElementById("message")
    .textContent = message;
}

function restartQuiz(){

  currentQuestion = 0;
  score = 0;

  scoreEl.textContent = "Score: 0";

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("quizBox")
    .style.display = "block";

  loadQuestion();
}

loadQuestion();

</script>
